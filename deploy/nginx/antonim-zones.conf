# /etc/nginx/conf.d/antonim-zones.conf  (http {} level; used by apps.badita.com.d/antonim.conf)

# Per visitor: 5 requests/s. $binary_remote_addr is the real visitor IP, restored
# from CF-Connecting-IP by cloudflare-realip.conf (only Cloudflare can reach :443).
limit_req_zone $binary_remote_addr zone=antonim_per_ip:10m rate=5r/s;

# Answers barely change: cache 200s for a day. A cache hit never reaches the
# proxy, so it costs no invocation and no slot in the proxy's global cap.
proxy_cache_path /var/cache/nginx/antonim levels=1:2 keys_zone=antonim:1m
                 max_size=50m inactive=7d use_temp_path=off;

upstream antonime_proxy {
    server 127.0.0.1:8091;               # antonime-proxy.service (loopback only)
    keepalive 4;
}
