# /etc/nginx/apps.badita.com.d/antonim.conf  (included inside the apps.badita.com server {})
#   GET /antonim/api/antonime?cuvant=...  -> cache -> antonime-proxy -> OCI Function
#   /antonim/ (the page) comes in step 6.

location = /antonim/api/antonime {
    limit_except GET { deny all; }       # GET (and HEAD) only; same origin, so no CORS/OPTIONS

    limit_req zone=antonim_per_ip burst=5 nodelay;   # 5/s + short bursts, then 429
    limit_req_status 429;
    error_page 429 = @antonim_429;

    proxy_pass http://antonime_proxy/antonime;       # query string is passed along
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout    65s;           # a cold start took 44 s

    proxy_cache            antonim;
    proxy_cache_key        $args;
    proxy_ignore_headers   Cache-Control Expires;    # our TTL, not the function's 1 h
    proxy_cache_valid      200 1d;                   # only real answers; errors never cached
    proxy_cache_lock       on;           # 100 parallel requests for one word = 1 invocation
    proxy_cache_lock_timeout 65s;
    # Backend down or global cap reached: an old answer beats an error.
    proxy_cache_use_stale  error timeout http_429 http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
}

location @antonim_429 {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 429 '{"eroare": "Prea multe cereri. Încearcă din nou peste un minut."}\n';
}
